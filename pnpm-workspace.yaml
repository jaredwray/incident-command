minimumReleaseAge: 10080 # 7 days, in minutes
minimumReleaseAgeStrict: true # fail instead of falling back to a too-new version
minimumReleaseAgeIgnoreMissingTime: false # missing publish-time metadata fails closed
trustPolicy: no-downgrade # fail if a later version has weaker trust evidence
# semver 6.3.1 fixes CVE-2022-25883. That release has no provenance.
trustPolicyExclude:
  - semver@6.3.1
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
blockExoticSubdeps: true
overrides:
  # make-dir 3.1.0 depends on semver 6. Use the patched release.
  "make-dir@3>semver": 6.3.1
  # @node-minify/core 9.0.2 pins glob 10.3.3. The 9.x line ends at that release.
  # This override selects glob 10.5.0 for that parent and fixes CVE-2025-64756.
  "@node-minify/core>glob": 10.5.0
allowBuilds:
  esbuild: true # Vite and Wrangler native binary
  mongodb-memory-server: true # MongoDB binary for tests
  workerd: true # Cloudflare Workers runtime binary
