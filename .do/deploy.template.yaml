# Used by the "Deploy to DigitalOcean" button (see deploy/digitalocean/README.md).
# Same setup as deploy/digitalocean/app.yaml, built from the public repo.
# Fill in ADMIN_EMAIL / ADMIN_PASSWORD (or SETUP_TOKEN) in the create flow.
spec:
  name: incident-command
  services:
    - name: web
      git:
        repo_clone_url: https://github.com/jaredwray/incident-command.git
        branch: main
      dockerfile_path: Dockerfile
      http_port: 3000
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      health_check:
        http_path: /api/health
        initial_delay_seconds: 20
        period_seconds: 15
        timeout_seconds: 5
        failure_threshold: 6
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          value: "${db.DATABASE_URL}&uselibpqcompat=true"
        - key: SITE_URL
          scope: RUN_TIME
          value: ${APP_URL}
        - key: HOSTNAME
          scope: RUN_TIME
          value: 0.0.0.0
        - key: ADMIN_EMAIL
          scope: RUN_TIME
        - key: ADMIN_PASSWORD
          scope: RUN_TIME
          type: SECRET
        - key: SETUP_TOKEN
          scope: RUN_TIME
          type: SECRET
  ingress:
    rules:
      - component:
          name: web
        match:
          path:
            prefix: /
  databases:
    - name: db
      engine: PG
      production: false
