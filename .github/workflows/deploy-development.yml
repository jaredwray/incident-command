name: deploy-development

# Deploys the incident-command-development Worker to https://dev.incident-command.org.
# The "development" GitHub environment holds the Cloudflare credentials:
#   CLOUDFLARE_API_TOKEN   secret: API token that can deploy Workers
#   CLOUDFLARE_ACCOUNT_ID  secret: the Cloudflare account ID
# Worker secrets (DATABASE_URL, SETUP_TOKEN, ...) stay on the Worker.
# See deploy/cloudflare/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deploy at a time. Do not cancel a deploy that is in progress.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy-development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout
    environment:
      name: development
      url: https://dev.incident-command.org
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.16.0"

      - name: Set up pnpm (version from package.json packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # This job deploys, so it does not restore a package cache (cache poisoning).
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # The deploy does not run tests, so skip the MongoDB binary download.
      - name: Install dependencies
        run: sfw pnpm install --frozen-lockfile
        env:
          MONGOMS_DISABLE_POSTINSTALL: "1"

      - name: Build the Worker
        run: pnpm exec opennextjs-cloudflare build --env development

      # wrangler finds the OpenNext project and runs `opennextjs-cloudflare deploy`,
      # which then runs `wrangler deploy --env development`.
      - name: Deploy with wrangler
        run: pnpm exec wrangler deploy --env development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
